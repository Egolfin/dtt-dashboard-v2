<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTT Analytics Pro</title>
    
    <!-- Dynamic SVG Favicon -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='fG' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231e40af'/><stop offset='100%' stop-color='%230284c7'/></linearGradient><linearGradient id='fB' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23a855f7'/><stop offset='50%' stop-color='%233b82f6'/><stop offset='100%' stop-color='%2306b6d4'/></linearGradient></defs><circle cx='50' cy='50' r='48' fill='%23090d16' stroke='%231d4ed8' stroke-width='4'/><circle cx='50' cy='50' r='40' fill='url(%23fG)' opacity='0.4'/><rect x='22' y='52' width='6' height='16' rx='2' fill='%2338bdf8'/><rect x='31' y='44' width='6' height='24' rx='2' fill='%2360a5fa'/><rect x='40' y='38' width='6' height='30' rx='2' fill='%23c084fc'/><path d='M 58 14 L 38 52 L 52 50 L 32 86 L 82 40 L 58 42 Z' fill='url(%23fB)'/></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbg: '#090d16', cardbg: '#111827', bordercolor: '#1f2937' } } } }
    </script>
    <!-- PapaParse & SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header & Navigation -->
    <header class="border-b border-gray-800/80 bg-gray-950/50 backdrop-blur-md sticky top-0 z-50 py-3.5 px-6">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 relative flex items-center justify-center">
                    <svg class="w-10 h-10 drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="dialBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
                            <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="46" fill="#090d16" stroke="#1d4ed8" stroke-width="4"/>
                        <circle cx="50" cy="50" r="38" fill="url(#dialBg)" fill-opacity="0.25"/>
                        <circle cx="50" cy="50" r="38" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 8" stroke-dashoffset="5"/>
                        <rect x="22" y="52" width="6" height="16" rx="2" fill="#38bdf8"/>
                        <rect x="31" y="44" width="6" height="24" rx="2" fill="#60a5fa"/>
                        <rect x="40" y="38" width="6" height="30" rx="2" fill="#c084fc"/>
                        <path d="M 58 12 L 38 52 L 52 50 L 32 88 L 82 40 L 58 42 Z" fill="url(#boltGrad)" stroke="#090d16" stroke-width="2"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">DTT Analytics Pro</h1>
                    <p class="text-xs text-gray-400">Dials, Talk Time & Performance</p>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div id="mainTabNav" class="flex items-center gap-6 text-xs border-b border-gray-800">
                <button onclick="app.switchTab('matrix')" id="tab-matrix" class="tab-btn active pb-3 px-2 text-gray-300 hover:text-white font-medium">📊 DTT Matrix</button>
                <button onclick="app.switchTab('metrics')" id="tab-metrics" class="tab-btn pb-3 px-2 text-gray-400 hover:text-white font-medium">🎯 Advanced Metrics</button>
                <button onclick="app.switchTab('manual')" id="tab-manual" class="tab-btn pb-3 px-2 text-gray-400 hover:text-white font-medium">📝 Manual Records <span id="manualBadgeCount" class="bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold ml-1">0</span></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8" id="app-container">
        <!-- Views will be injected here dynamically by JavaScript -->
    </main>

    <!-- App Scripts -->
    <script src="js/data.js"></script>
    <script src="js/metrics.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
